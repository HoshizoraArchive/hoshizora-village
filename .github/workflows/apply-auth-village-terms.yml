name: Apply Auth village terms

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/auth-village-terms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-village-terms
          fetch-depth: 0
      - name: Update Auth village terminology
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text()

          form_marker = '        <form className="mt-3 space-y-3" onSubmit={handleSubmit}>'
          form_start = app.index(form_marker)
          tabs_start = app.index('          <div className="grid grid-cols-2 rounded-2xl border border-white/10 bg-white/5 p-1">', form_start)
          email_marker = '\n\n          <label className="block text-xs font-bold text-slate-400">\n            メールアドレス'
          tabs_end = app.index(email_marker, tabs_start)

          new_tabs = '''          <div className="grid grid-cols-2 rounded-2xl border border-white/10 bg-white/5 p-1">
            <button
              aria-label="村へ帰る（ログイン）"
              className={`relative min-h-12 rounded-xl px-3 pb-4 pt-2 text-xs font-black transition ${
                mode === "login"
                  ? "bg-comet/20 text-comet shadow-[0_0_18px_rgba(103,232,249,0.12)]"
                  : "text-comet/75 hover:bg-comet/10 hover:text-comet"
              }`}
              onClick={() => setMode("login")}
              type="button"
            >
              <span className="block text-[13px] leading-5">村へ帰る</span>
              <span aria-hidden="true" className="absolute bottom-1 right-2 text-[9px] font-bold text-white/85">
                （ログイン）
              </span>
            </button>
            <button
              aria-label="入村手続き（会員登録）"
              className={`relative min-h-12 rounded-xl px-3 pb-4 pt-2 text-xs font-black transition ${
                mode === "signup"
                  ? "bg-gradient-to-r from-aurora/20 to-sakura/20 text-sakura shadow-[0_0_18px_rgba(244,114,182,0.14)]"
                  : "text-sakura/75 hover:bg-sakura/10 hover:text-sakura"
              }`}
              onClick={() => setMode("signup")}
              type="button"
            >
              <span className="block text-[13px] leading-5">入村手続き</span>
              <span aria-hidden="true" className="absolute bottom-1 right-2 text-[9px] font-bold text-white/85">
                （会員登録）
              </span>
            </button>
          </div>'''

          app = app[:tabs_start] + new_tabs + app[tabs_end:]

          old_submit = '{auth.loading ? "処理中..." : isSignUp ? "会員登録する" : "ログインする"}'
          new_submit = '{auth.loading ? "処理中..." : isSignUp ? "入村する" : "村へ帰る"}'
          if app.count(old_submit) != 1:
              raise SystemExit(f'Expected exactly one Auth submit label, found {app.count(old_submit)}')
          app = app.replace(old_submit, new_submit, 1)
          app_path.write_text(app)

          e2e_path = Path('e2e/smoke.spec.mjs')
          e2e = e2e_path.read_text()
          replacements = [
              ('name: "ログインする"', 'name: "村へ帰る"'),
              ('name: "会員登録", exact: true', 'name: "入村手続き（会員登録）", exact: true'),
              ('name: "会員登録する"', 'name: "入村する"'),
          ]
          for old, new in replacements:
              if old not in e2e:
                  raise SystemExit(f'E2E selector not found: {old}')
              e2e = e2e.replace(old, new)
          e2e_path.write_text(e2e)
          PY
      - name: Remove temporary implementation helpers
        run: |
          rm -f .github/workflows/apply-auth-village-terms.yml .auth-village-terms-trigger
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Auth操作を星空Village用語に変更"
          git push origin HEAD:fix/auth-village-terms
