name: Apply Auth village terms

on:
  push:
    branches:
      - fix/auth-village-terms

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-village-terms
          fetch-depth: 0
      - name: Update Auth village terminology
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text()

          old_tabs = '''          <div className="grid grid-cols-2 rounded-2xl border border-white/10 bg-white/5 p-1">
            <button
              className={`min-h-9 rounded-xl text-xs font-black transition ${
                mode === "login" ? "bg-comet/20 text-white" : "text-slate-400 hover:text-white"
              }`}
              onClick={() => setMode("login")}
              type="button"
            >
              ログイン
            </button>
            <button
              className={
                `min-h-9 rounded-xl text-xs font-black transition ${
                  mode === "signup" ? "bg-comet/20 text-white" : "text-slate-400 hover:text-white"
                }
              `}
              onClick={() => setMode("signup")}
              type="button"
            >
              会員登録
            </button>
          </div>'''

          new_tabs = '''          <div className="grid grid-cols-2 rounded-2xl border border-white/10 bg-white/5 p-1">
            <button
              aria-label="村へ帰る（ログイン）"
              className={`relative min-h-12 rounded-xl px-3 pb-4 pt-2 text-xs font-black transition ${
                mode === "login"
                  ? "bg-comet/20 text-comet shadow-[0_0_18px_rgba(103,232,249,0.12)]"
                  : "text-comet/75 hover:bg-comet/10 hover:text-comet"
              }`}
              onClick={() => setMode("login")}
              type="button"
            >
              <span className="block text-[13px] leading-5">村へ帰る</span>
              <span aria-hidden="true" className="absolute bottom-1 right-2 text-[9px] font-bold text-white/85">
                （ログイン）
              </span>
            </button>
            <button
              aria-label="入村手続き（会員登録）"
              className={`relative min-h-12 rounded-xl px-3 pb-4 pt-2 text-xs font-black transition ${
                mode === "signup"
                  ? "bg-gradient-to-r from-aurora/20 to-sakura/20 text-sakura shadow-[0_0_18px_rgba(244,114,182,0.14)]"
                  : "text-sakura/75 hover:bg-sakura/10 hover:text-sakura"
              }`}
              onClick={() => setMode("signup")}
              type="button"
            >
              <span className="block text-[13px] leading-5">入村手続き</span>
              <span aria-hidden="true" className="absolute bottom-1 right-2 text-[9px] font-bold text-white/85">
                （会員登録）
              </span>
            </button>
          </div>'''

          if old_tabs not in app:
              raise SystemExit('Auth tabs source did not match expected main state')
          app = app.replace(old_tabs, new_tabs, 1)

          old_submit = '''          <button
            className="min-h-10 w-full rounded-2xl bg-gradient-to-r from-comet via-aurora to-sakura px-4 text-xs font-black text-night-950 shadow-glow transition hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-60"
            disabled={auth.loading || (isSignUp && !signUpConsentReady)}
            type="submit"
          >
            {auth.loading ? "処理中..." : isSignUp ? "会員登録する" : "ログインする"}
          </button>'''

          new_submit = '''          <button
            className="min-h-10 w-full rounded-2xl bg-gradient-to-r from-comet via-aurora to-sakura px-4 text-xs font-black text-night-950 shadow-glow transition hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-60"
            disabled={auth.loading || (isSignUp && !signUpConsentReady)}
            type="submit"
          >
            {auth.loading ? "処理中..." : isSignUp ? "入村する" : "村へ帰る"}
          </button>'''

          if old_submit not in app:
              raise SystemExit('Auth submit source did not match expected main state')
          app = app.replace(old_submit, new_submit, 1)
          app_path.write_text(app)

          e2e_path = Path('e2e/smoke.spec.mjs')
          e2e = e2e_path.read_text()
          e2e = e2e.replace('name: "ログインする"', 'name: "村へ帰る"')
          e2e = e2e.replace('name: "会員登録", exact: true', 'name: "入村手続き（会員登録）", exact: true')
          e2e = e2e.replace('name: "会員登録する"', 'name: "入村する"')
          e2e_path.write_text(e2e)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx e2e/smoke.spec.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: Auth操作を星空Village用語に変更"
          git push origin HEAD:fix/auth-village-terms
