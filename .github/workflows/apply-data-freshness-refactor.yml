name: Apply data freshness refactor

on:
  push:
    branches:
      - fix/observe-card-full-refresh-20260803
    paths:
      - scripts/apply-app-data-freshness-refactor.mjs
      - .github/workflows/apply-data-freshness-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip freshness refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/observe-card-full-refresh-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic App.jsx refactor
        run: node scripts/apply-app-data-freshness-refactor.mjs
      - name: Commit transformed App.jsx
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "投稿カード再同期をApp内のサーバーデータ更新へ変更 [skip freshness refactor]"
          git push origin HEAD:fix/observe-card-full-refresh-20260803
