name: Temporary Auth Single Card Width Guard

on:
  push:
    branches:
      - fix/auth-panel-single-card

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-panel-single-card
      - name: Preserve desktop AuthPanel width without outer card
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("src/App.jsx")
          app = app_path.read_text()
          old = '<div className="mb-4" data-auth-panel="visible">\n      <AuthPanel auth={auth} />'
          new = '<div className="mb-4 lg:ml-auto lg:w-[320px]" data-auth-panel="visible">\n      <AuthPanel auth={auth} />'
          if app.count(old) != 1:
              raise SystemExit(f"AppHeader wrapper target count was {app.count(old)}, expected 1")
          app_path.write_text(app.replace(old, new))

          test_path = Path("netlify/functions/_shared/authHeaderUi.test.mjs")
          test_source = test_path.read_text()
          old_test = 'assert.match(appHeaderSource, /<div className="mb-4" data-auth-panel="visible">/);'
          new_test = 'assert.match(appHeaderSource, /<div className="mb-4 lg:ml-auto lg:w-\\[320px\\]" data-auth-panel="visible">/);'
          if test_source.count(old_test) != 1:
              raise SystemExit(f"Auth header width assertion target count was {test_source.count(old_test)}, expected 1")
          test_path.write_text(test_source.replace(old_test, new_test))

          Path(".github/workflows/temp-auth-single-card-width-fix.yml").unlink()
      - name: Commit width guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx netlify/functions/_shared/authHeaderUi.test.mjs .github/workflows/temp-auth-single-card-width-fix.yml
          git diff --cached --check
          git commit -m "fix: Authカードのデスクトップ幅を維持"
          git push origin HEAD:fix/auth-panel-single-card
