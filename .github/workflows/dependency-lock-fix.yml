name: Dependency Lock Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/dependency-audit-2026-08-05'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-2026-08-05

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate minimal security lockfile update
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile update when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "脆弱な依存関係をlockfileで更新"
          git push origin HEAD:security/dependency-audit-2026-08-05
