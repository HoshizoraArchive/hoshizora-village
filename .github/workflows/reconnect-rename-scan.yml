name: ReConnect rename apply

on:
  push:
    branches:
      - codex/rename-reconnect

permissions:
  contents: write

jobs:
  rename-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/rename-reconnect
          fetch-depth: 0

      - name: Replace legacy product label only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "R" + ".Connect"
          new = "Re:Connect"
          result = subprocess.run(
              ["git", "grep", "-IlF", old, "--", "."],
              check=False,
              capture_output=True,
              text=True,
          )
          files = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          if not files:
              raise SystemExit("No legacy product-label references found; refusing an empty rename run.")

          total = 0
          for name in files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  total += count
                  print(f"{name}: {count}")

          print(f"Replaced {total} exact product-label references across {len(files)} tracked text files.")
          PY

      - name: Add live database wording migration
        shell: bash
        run: |
          cat > supabase/migrations/20260807071000_rename_rconnect_to_reconnect.sql <<'SQL'
          begin;

          -- Keep already-seeded, user-visible Village Guide copy aligned with the new product name.
          update public.guide_entries
          set body = replace(body, 'R.' || 'Connect', 'Re:Connect')
          where strpos(body, 'R.' || 'Connect') > 0;

          -- Keep existing notification rows consistent when an older fallback message contains the old label.
          update public.notifications
          set message = replace(message, 'R.' || 'Connect', 'Re:Connect')
          where strpos(message, 'R.' || 'Connect') > 0;

          -- Refresh developer-facing database descriptions without changing any table/column identifiers.
          comment on table public.notifications is
          'Re:Connect通知。共鳴、Archive、星文などの通知を保存する。';

          comment on column public.profiles.notify_authors_when_i_archive is
          '自分が誰かの流星便をArchiveした時、相手にRe:Connect通知を送るかどうか。デフォルトON。';

          comment on column public.profiles.notify_authors_when_i_resonate is
          '自分が誰かの流星便に共鳴した時、相手にRe:Connect通知を送るかどうか。デフォルトON。';

          comment on table public.push_subscriptions is
          'Re:ConnectスマホPush通知用の端末購読情報。Netlify Functionのservice_role経由でのみ登録する。';

          comment on table public.push_notification_jobs is
          'Re:Connect通知を登録済み端末へWeb Push配信するためのserver-side queue。browser roleからは直接操作させない。';

          commit;
          SQL

      - name: Guard onboarding contracts and naming
        shell: bash
        run: |
          OLD='R''.'Connect
          if git grep -nF "$OLD" -- .; then
            echo 'Legacy product-label text remains.' >&2
            exit 1
          fi

          grep -q 'rconnect_intro' src/onboarding.js
          grep -q 'id: "rconnect"' src/App.jsx
          grep -q 'function RConnectScreen' src/App.jsx
          grep -q '次は「Re:Connect」！' src/onboarding.js
          grep -q 'label: "Re:Connect"' src/App.jsx

          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run node tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Commit verified rename
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename R.Connect to Re:Connect'
          git push origin HEAD:codex/rename-reconnect
