name: Apply My Constellation tabs

on:
  push:
    branches:
      - feat/my-constellation-tabs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d .codex/myconst.patch.gz.b64 | gzip -d > /tmp/myconst.patch
          git apply --check /tmp/myconst.patch
          git apply /tmp/myconst.patch
          rm -rf .codex
          rm -f .github/workflows/apply-myconst.yml
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "HoshizoraArchive"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src/App.jsx netlify/functions/_shared/myConstellationTabs.test.mjs .codex/myconst.patch.gz.b64 .github/workflows/apply-myconst.yml
          git commit -m "feat: My Constellationを3タブ化"
          git push origin HEAD:feat/my-constellation-tabs
