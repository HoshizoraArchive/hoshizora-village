name: Temporary auth header edit

on:
  push:
    branches:
      - fix/auth-header-tagline

permissions:
  contents: write

jobs:
  edit-auth-header:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-header-tagline

      - name: Simplify auth header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.jsx")
          source = path.read_text()
          old = '''function AppHeader({ auth }) {
            if (auth.session && auth.confirmation?.kind !== AUTH_CONFIRMATION_KIND.CONFIRMED) {
              return null;
            }

            return (
              <header className="glass-panel mb-4 p-4" data-auth-panel="visible">
                <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_320px] lg:items-start">
                  <div className="flex items-center gap-3">
                    <div className="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-comet via-aurora to-sakura text-lg font-black text-night-950 shadow-glow">
                      星
                    </div>
                    <div>
                      <p className="text-xs font-bold normal-case text-comet">Re:AiSNS</p>
                      <h1 className="text-xl font-black leading-tight">星空Village</h1>
                    </div>
                  </div>

                  <AuthPanel auth={auth} />
                </div>
              </header>
            );
          }
          '''
          new = '''function AppHeader({ auth }) {
            if (auth.session && auth.confirmation?.kind !== AUTH_CONFIRMATION_KIND.CONFIRMED) {
              return null;
            }

            return (
              <header className="glass-panel mb-4 p-4" data-auth-panel="visible">
                <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_320px] lg:items-start">
                  <h1 className="text-sm font-black leading-6 text-comet">バズより共鳴。</h1>

                  <AuthPanel auth={auth} />
                </div>
              </header>
            );
          }
          '''

          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one AppHeader block, found {source.count(old)}")

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit edit
        shell: bash
        run: |
          rm .github/workflows/temp-auth-header-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/temp-auth-header-edit.yml
          git commit -m "fix: authヘッダーをバズより共鳴のみに整理"
          git push origin HEAD:fix/auth-header-tagline
