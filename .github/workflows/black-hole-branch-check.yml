name: Black Hole Branch Check

on:
  push:
    branches:
      - feat/black-hole-blocking
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Import all Netlify Functions
        run: |
          node --input-type=module <<'EOF'
          import { readdir } from "node:fs/promises";
          const files = (await readdir("netlify/functions"))
            .filter((file) => file.endsWith(".mjs"))
            .sort();
          for (const file of files) {
            await import(`./netlify/functions/${file}`);
          }
          console.log(`Imported ${files.length}/${files.length} Netlify Functions`);
          EOF

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
