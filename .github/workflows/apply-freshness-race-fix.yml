name: Apply freshness race fix

on:
  push:
    branches:
      - fix/observe-card-full-refresh-20260803
    paths:
      - scripts/apply-freshness-race-fix.mjs
      - .github/workflows/apply-freshness-race-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip freshness race fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/observe-card-full-refresh-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-freshness-race-fix.mjs
      - name: Commit App.jsx race fix
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "再同期single-flight中も関連カード更新を落とさない [skip freshness race fix]"
          git push origin HEAD:fix/observe-card-full-refresh-20260803
