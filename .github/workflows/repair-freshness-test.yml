name: Repair freshness test exactly

on:
  push:
    branches:
      - codex/resonance-pressed-visual-state

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/resonance-pressed-visual-state
          fetch-depth: 0

      - name: Restore test from main and patch one assertion only
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- netlify/functions/_shared/appDataFreshness.test.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('netlify/functions/_shared/appDataFreshness.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.equal(appSource.includes("applyResonanceCountsEverywhere(postIds, countsByPost, requestTokens)"), true);'
          new = '''  assert.match(\n    appSource,\n    /applyResonanceCountsEverywhere\\(\\s*acceptedPostIds,\\s*countsByPost,\\s*viewerResonatedPostIdsFromSnapshot,\\s*requestTokens,\\s*\\);/,\n  );'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code origin/main -- netlify/functions/_shared/appDataFreshness.test.mjs >/tmp/test.diff || true
          grep -q 'viewerResonatedPostIdsFromSnapshot' netlify/functions/_shared/appDataFreshness.test.mjs

      - name: Commit repaired test only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/_shared/appDataFreshness.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update freshness assertion for resonance visual state'
          git push origin HEAD:codex/resonance-pressed-visual-state
