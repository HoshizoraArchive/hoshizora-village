name: One-time beta CI source patch

on:
  push:
    branches:
      - fix/beta-ci-quality-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/beta-ci-quality-gate
          fetch-depth: 0

      - name: Apply exact source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('src/App.jsx'),
                  '!isTrustedProtectedProfile({ primaryTitle });',
                  '!isTrustedProtectedProfile({ id: profile?.id, primaryTitle });',
              ),
              (
                  Path('src/profileBlocking.js'),
                  '  if (!profileId) {\n    return false;\n  }',
                  '  if (!profileId) {\n    return Object.prototype.hasOwnProperty.call(profile ?? {}, "primaryTitle");\n  }',
              ),
              (
                  Path('netlify/functions/_shared/observePolish.test.mjs'),
                  'top: 0\\.8rem[\\s\\S]*right: 0\\.8rem',
                  'top: 0[\\s\\S]*right: 0\\.8rem',
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-beta-ci-patch.yml

      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/profileBlocking.js netlify/functions/_shared/observePolish.test.mjs .github/workflows/one-time-beta-ci-patch.yml
          git diff --cached --check
          git commit -m "fix: restore beta quality gate invariants"
          git push origin HEAD:fix/beta-ci-quality-gate
