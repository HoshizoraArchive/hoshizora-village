name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Node tests, build, and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run node tests
        run: npm test

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Diagnose browser E2E by spec
        shell: bash
        run: |
          set -euo pipefail
          for spec in e2e/*.spec.mjs; do
            echo "::group::Playwright ${spec}"
            timeout 90s npx playwright test "${spec}" --workers=1 --retries=0 --reporter=line
            echo "::endgroup::"
          done

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
