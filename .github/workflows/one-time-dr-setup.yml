name: One-time disaster recovery setup

on:
  push:
    branches:
      - ops/disaster-recovery-backups

permissions:
  contents: write

jobs:
  setup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/disaster-recovery-backups
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Netlify Blobs dependency
        run: npm install --save @netlify/blobs@10.7.10

      - name: Sync disaster recovery RPCs into schema snapshot
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations/20260801133000_add_disaster_recovery_snapshot_rpcs.sql')
          schema = schema_path.read_text()
          migration = migration_path.read_text()
          marker = 'create or replace function public.create_disaster_recovery_snapshot()'

          if marker in schema:
              raise SystemExit('disaster recovery RPCs already exist in schema.sql')

          schema_path.write_text(schema.rstrip() + '\n\n' + migration.strip() + '\n')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-dr-setup.yml

      - name: Commit generated dependency and schema updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json supabase/schema.sql .github/workflows/one-time-dr-setup.yml
          git diff --cached --check
          git commit -m "chore: wire disaster recovery backup dependencies"
          git push origin HEAD:ops/disaster-recovery-backups
