name: Export Supabase migrations for preview v2

on:
  push:
    branches:
      - chore/export-supabase-migrations-preview-v2
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package database-related source
        run: |
          test -d supabase/migrations
          tar -czf hoshizora-db-source.tar.gz supabase docs src netlify package.json
      - name: Upload database-related source
        uses: actions/upload-artifact@v4
        with:
          name: hoshizora-db-source-preview-v2
          path: hoshizora-db-source.tar.gz
          retention-days: 1
