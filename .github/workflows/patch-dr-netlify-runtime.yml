name: Apply DR Netlify runtime patch

on:
  push:
    branches:
      - fix/dr-netlify-runtime-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dr-netlify-runtime-context
      - name: Apply strict runtime patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'netlify/functions/disaster-recovery-backup.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const oldBlock = `function readBackupConfig() {
            const supabaseUrl = process.env.SUPABASE_URL ?? process.env.VITE_SUPABASE_URL;
            const supabaseServiceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;

            if (process.env.CONTEXT !== "production") {
              throw new Error("disaster_recovery_production_only");
            }

            if (!supabaseUrl || !supabaseServiceRoleKey) {
              throw new Error("disaster_recovery_missing_supabase_config");
            }

            return { supabaseUrl, supabaseServiceRoleKey };
          }`;
          const newBlock = `function readRuntimeEnv(name) {
            const env = globalThis.Netlify?.env ?? process.env;

            if (env && typeof env.get === "function") {
              return env.get(name) ?? "";
            }

            return env?.[name] ?? "";
          }

          function readDeployContext() {
            return globalThis.Netlify?.context?.deploy?.context ?? process.env.CONTEXT ?? "";
          }

          function readBackupConfig() {
            const supabaseUrl = readRuntimeEnv("SUPABASE_URL") || readRuntimeEnv("VITE_SUPABASE_URL");
            const supabaseServiceRoleKey = readRuntimeEnv("SUPABASE_SERVICE_ROLE_KEY");

            if (readDeployContext() !== "production") {
              throw new Error("disaster_recovery_production_only");
            }

            if (!supabaseUrl || !supabaseServiceRoleKey) {
              throw new Error("disaster_recovery_missing_supabase_config");
            }

            return { supabaseUrl, supabaseServiceRoleKey };
          }`;
          if (!source.includes(oldBlock)) {
            throw new Error('expected readBackupConfig block not found exactly once');
          }
          source = source.replace(oldBlock, newBlock);
          const oldCommitRef = 'commitRef: process.env.COMMIT_REF ?? null,';
          if (!source.includes(oldCommitRef)) {
            throw new Error('expected COMMIT_REF expression not found');
          }
          source = source.replace(oldCommitRef, 'commitRef: readRuntimeEnv("COMMIT_REF") || null,');
          fs.writeFileSync(file, source);

          const testFile = 'netlify/functions/_shared/disasterRecovery.test.mjs';
          let testSource = fs.readFileSync(testFile, 'utf8');
          if (!testSource.includes('readFileSync')) {
            testSource = testSource.replace(
              'import assert from "node:assert/strict";\n',
              'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n',
            );
          }
          const marker = 'test("DR function uses Netlify runtime context and environment APIs", () => {';
          if (!testSource.includes(marker)) {
            testSource += `\n\ntest("DR function uses Netlify runtime context and environment APIs", () => {\n  const functionSource = readFileSync("netlify/functions/disaster-recovery-backup.mjs", "utf8");\n  assert.match(functionSource, /globalThis\\.Netlify\\?\\.env/);\n  assert.match(functionSource, /globalThis\\.Netlify\\?\\.context\\?\\.deploy\\?\\.context/);\n  assert.doesNotMatch(functionSource, /if \\(process\\.env\\.CONTEXT !== "production"\\)/);\n});\n`;
          }
          fs.writeFileSync(testFile, testSource);
          fs.rmSync('.github/workflows/patch-dr-netlify-runtime.yml');
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/disaster-recovery-backup.mjs netlify/functions/_shared/disasterRecovery.test.mjs .github/workflows/patch-dr-netlify-runtime.yml
          git commit -m "fix: use Netlify runtime context for DR backups"
          git push origin HEAD:fix/dr-netlify-runtime-context
