name: Export preview source

on:
  push:
    branches:
      - feat/star-letter-archive-screen
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/preview-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-source
          path: /tmp/preview-source.tgz
          retention-days: 1

  bundle-netlify-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Install Netlify MCP runtime
        run: |
          mkdir -p /tmp/netlify-mcp-runtime
          cd /tmp/netlify-mcp-runtime
          npm init -y
          npm install --omit=dev @netlify/mcp@1.15.1
          tar -czf /tmp/netlify-mcp-runtime.tgz node_modules package.json package-lock.json
      - name: Upload Netlify MCP runtime
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime
          path: /tmp/netlify-mcp-runtime.tgz
          retention-days: 1
