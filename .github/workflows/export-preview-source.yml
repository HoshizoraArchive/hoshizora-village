name: Export preview source

on:
  push:
    branches:
      - feat/star-letter-archive-screen
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git --exclude=node_modules -czf preview-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-source
          path: preview-source.tgz
          retention-days: 1
