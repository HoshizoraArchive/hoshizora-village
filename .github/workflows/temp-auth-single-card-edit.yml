name: Temporary Auth Single Card Edit

on:
  push:
    branches:
      - fix/auth-panel-single-card

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-panel-single-card
      - name: Apply focused Auth UI edit
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("src/App.jsx")
          app = app_path.read_text()
          old = '''function AppHeader({ auth }) {
            if (auth.session && auth.confirmation?.kind !== AUTH_CONFIRMATION_KIND.CONFIRMED) {
              return null;
            }

            return (
              <header className="glass-panel mb-4 p-4" data-auth-panel="visible">
                <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_320px] lg:items-start">
                  <h1 className="text-sm font-black leading-6 text-comet">バズより共鳴。</h1>

                  <AuthPanel auth={auth} />
                </div>
              </header>
            );
          }'''
          new = '''function AppHeader({ auth }) {
            if (auth.session && auth.confirmation?.kind !== AUTH_CONFIRMATION_KIND.CONFIRMED) {
              return null;
            }

            return (
              <div className="mb-4" data-auth-panel="visible">
                <AuthPanel auth={auth} />
              </div>
            );
          }'''
          if app.count(old) != 1:
              raise SystemExit(f"AppHeader target count was {app.count(old)}, expected 1")
          app_path.write_text(app.replace(old, new))

          test_path = Path("netlify/functions/_shared/authHeaderUi.test.mjs")
          test_source = test_path.read_text()
          old_test = '''test("未ログインヘッダーは『バズより共鳴。』だけをブランド表示する", () => {
            const appHeaderSource = getAppHeaderSource();

            assert.match(appHeaderSource, /<h1 className="[^\"]*">バズより共鳴。<\\/h1>/);
            assert.doesNotMatch(appHeaderSource, /Re:AiSNS/);
            assert.doesNotMatch(appHeaderSource, /星空Village/);
            assert.doesNotMatch(appHeaderSource, /shadow-glow/);
            assert.match(appHeaderSource, /<AuthPanel auth=\\{auth\\} \\/>/);
          });'''
          new_test = '''test("未ログインヘッダーは外側カードやブランド文言を持たずAuthPanelだけを表示する", () => {
            const appHeaderSource = getAppHeaderSource();

            assert.doesNotMatch(appHeaderSource, /バズより共鳴。/);
            assert.doesNotMatch(appHeaderSource, /Re:AiSNS/);
            assert.doesNotMatch(appHeaderSource, /星空Village/);
            assert.doesNotMatch(appHeaderSource, /glass-panel/);
            assert.doesNotMatch(appHeaderSource, /<header/);
            assert.match(appHeaderSource, /<div className="mb-4" data-auth-panel="visible">/);
            assert.match(appHeaderSource, /<AuthPanel auth=\\{auth\\} \\/>/);
          });'''
          if test_source.count(old_test) != 1:
              raise SystemExit(f"authHeaderUi test target count was {test_source.count(old_test)}, expected 1")
          test_path.write_text(test_source.replace(old_test, new_test))

          smoke_path = Path("e2e/smoke.spec.mjs")
          smoke = smoke_path.read_text()
          old_smoke = '  await expect(page.getByRole("heading", { name: "バズより共鳴。" })).toBeVisible();'
          new_smoke = '  await expect(page.getByText("Supabase Auth", { exact: true })).toBeVisible();'
          if smoke.count(old_smoke) != 1:
              raise SystemExit(f"smoke target count was {smoke.count(old_smoke)}, expected 1")
          smoke_path.write_text(smoke.replace(old_smoke, new_smoke))

          Path(".github/workflows/temp-auth-single-card-edit.yml").unlink()
      - name: Commit focused changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx netlify/functions/_shared/authHeaderUi.test.mjs e2e/smoke.spec.mjs .github/workflows/temp-auth-single-card-edit.yml
          git diff --cached --check
          git commit -m "fix: Auth画面の二重カードを解消"
          git push origin HEAD:fix/auth-panel-single-card
